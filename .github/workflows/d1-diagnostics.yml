name: D1 diagnostics (one-off, read-only)

# PATRON-LOAD II, after acct110 (2026-10-11, the owner: "People are still having issues. Some can get on, some cant"):
# the account service read where it stands since the deploy - D1 by the minute and its costliest statements since,
# the service's own points by route and refusal word (ADMIT-LINE's `queue` among them), two minutes of each Worker's
# stream. NOTHING here runs a statement on the database: D1's numbers are Cloudflare's GraphQL analytics, the routes the
# Analytics Engine SQL API, the streams `wrangler tail`. Every line printed is an aggregate: a path's ids folded, an
# error's first line with its quoted words folded, no header, address, body or handle read out. Removed once read.

on:
  push:
    branches: [ccr-dee27c02-memkav]
    paths: [".github/workflows/d1-diagnostics.yml"]

permissions:
  contents: read

concurrency:
  group: d1-diagnostics
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: a27adccb38c8e8b82fa32e5736274a94
      DB_NAME: daggerfall-accounts
      WORKER: daggerfall-accounts
      RELAY: daggerfall-online
      WRANGLER: npx --yes wrangler@4
      SINCE: "2026-10-11T01:17:00Z"
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Refuse to start without a token
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then echo "::error::secrets.CLOUDFLARE_API_TOKEN is not set"; exit 1; fi

      - name: The database's id
        run: |
          set -uo pipefail
          id=$($WRANGLER d1 list --json | jq -r --arg n "$DB_NAME" 'map(select(.name == $n)) | .[0].uuid // .[0].id // empty')
          echo "::add-mask::$id"
          echo "DB_ID=$id" >> "$GITHUB_ENV"

      - name: D1 by the minute, the last two hours
        run: |
          set -uo pipefail
          since=$(date -u -d '-2 hours' +%Y-%m-%dT%H:%M:00Z); until=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          q='query($a:String!,$d:String!,$s:Time!,$u:Time!){viewer{accounts(filter:{accountTag:$a}){d1AnalyticsAdaptiveGroups(limit:200,filter:{databaseId:$d,datetimeMinute_geq:$s,datetimeMinute_leq:$u},orderBy:[datetimeMinute_ASC]){dimensions{datetimeMinute} sum{readQueries writeQueries rowsRead rowsWritten} quantiles{queryBatchTimeMsP50 queryBatchTimeMsP90}}}}}'
          body=$(jq -n --arg q "$q" --arg a "$CLOUDFLARE_ACCOUNT_ID" --arg d "$DB_ID" --arg s "$since" --arg u "$until" '{query:$q,variables:{a:$a,d:$d,s:$s,u:$u}}')
          out=$(curl -sS https://api.cloudflare.com/client/v4/graphql -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'content-type: application/json' -d "$body")
          echo "$out" | jq -c '.errors // empty'
          echo -e "minute\treads\twrites\trowsRead\trowsWritten\tp50ms\tp90ms"
          echo "$out" | jq -r '.data.viewer.accounts[0].d1AnalyticsAdaptiveGroups[]? | [.dimensions.datetimeMinute[11:16], .sum.readQueries, .sum.writeQueries, .sum.rowsRead, .sum.rowsWritten, (.quantiles.queryBatchTimeMsP50|floor), (.quantiles.queryBatchTimeMsP90|floor)] | @tsv'

      - name: D1's costliest statements since the deploy
        run: |
          set -uo pipefail
          until=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          for order in sum_queryDurationMs_DESC sum_rowsRead_DESC count_DESC; do
            echo "=== by $order, since $SINCE"
            q="query(\$a:String!,\$d:String!,\$s:Time!,\$u:Time!){viewer{accounts(filter:{accountTag:\$a}){d1QueriesAdaptiveGroups(limit:20,filter:{databaseId:\$d,datetime_geq:\$s,datetime_leq:\$u},orderBy:[$order]){count sum{queryDurationMs rowsRead rowsWritten} dimensions{query}}}}}"
            body=$(jq -n --arg q "$q" --arg a "$CLOUDFLARE_ACCOUNT_ID" --arg d "$DB_ID" --arg s "$SINCE" --arg u "$until" '{query:$q,variables:{a:$a,d:$d,s:$s,u:$u}}')
            out=$(curl -sS https://api.cloudflare.com/client/v4/graphql -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'content-type: application/json' -d "$body")
            echo "$out" | jq -c '.errors // empty'
            echo -e "runs\ttotalMs\trowsRead\tavgRows\trowsWritten\tsql"
            echo "$out" | jq -r '.data.viewer.accounts[0].d1QueriesAdaptiveGroups[]? | [.count, (.sum.queryDurationMs|floor), .sum.rowsRead, ((.sum.rowsRead / ([.count,1]|max))|floor), .sum.rowsWritten, (.dimensions.query | gsub("\\s+";" ") | .[0:200])] | @tsv'
          done

      - name: The service's own points (Analytics Engine)
        run: |
          set -uo pipefail
          ae() {
            echo "=== $1"
            curl -sS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/analytics_engine/sql" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" --data-binary "$2 FORMAT JSON" \
              | jq -r '(.meta | map(.name) | @tsv), (.data[]? | [.[]] | map(if type == "number" then (. * 100 | round / 100) else . end) | @tsv)' 2>/dev/null || echo "query failed"
          }
          ae "five minutes, two hours: requests, 5xx, the line's 503 queue, statements, p95 ms" \
            "SELECT toStartOfInterval(timestamp, INTERVAL '5' MINUTE) AS t, SUM(_sample_interval) AS n, SUM(if(double2 >= 500, _sample_interval, 0)) AS e5, SUM(if(blob4 = 'queue', _sample_interval, 0)) AS queue, SUM(_sample_interval * double3) AS stmts, quantileWeighted(0.95)(double1, _sample_interval) AS p95 FROM daggerfall_accounts WHERE timestamp > NOW() - INTERVAL '2' HOUR GROUP BY t ORDER BY t"
          ae "the sign-in doors by five minutes, two hours: route, status, word, n" \
            "SELECT toStartOfInterval(timestamp, INTERVAL '5' MINUTE) AS t, index1 AS route, blob3 AS status, blob4 AS word, SUM(_sample_interval) AS n FROM daggerfall_accounts WHERE timestamp > NOW() - INTERVAL '2' HOUR AND index1 IN ('/v1/auth/token', '/v1/auth/guest', '/v1/auth/login', '/v1/auth/session', '/v1/auth/recover') GROUP BY t, route, status, word ORDER BY t, route, n DESC"
          ae "by route since the deploy: n, 5xx, queue, statements, per, p95" \
            "SELECT index1 AS route, SUM(_sample_interval) AS n, SUM(if(double2 >= 500, _sample_interval, 0)) AS e5, SUM(if(blob4 = 'queue', _sample_interval, 0)) AS queue, SUM(_sample_interval * double3) AS stmts, SUM(_sample_interval * double3) / SUM(_sample_interval) AS per, quantileWeighted(0.95)(double1, _sample_interval) AS p95 FROM daggerfall_accounts WHERE timestamp > toDateTime('2026-10-11 01:17:00') GROUP BY route ORDER BY n DESC LIMIT 40"
          ae "every refusal since the deploy: status, word, route, n" \
            "SELECT blob3 AS status, blob4 AS word, index1 AS route, SUM(_sample_interval) AS n FROM daggerfall_accounts WHERE timestamp > toDateTime('2026-10-11 01:17:00') AND double2 >= 400 GROUP BY status, word, route ORDER BY n DESC LIMIT 40"

      - name: Two minutes of each Worker's stream (aggregated)
        run: |
          set -uo pipefail
          timeout 120 $WRANGLER tail "$WORKER" --format json > "$RUNNER_TEMP/acc.json" 2>/dev/null &
          timeout 120 $WRANGLER tail "$RELAY" --format json > "$RUNNER_TEMP/relay.json" 2>/dev/null &
          wait
          agg='
            def norm: sub("^https?://[^/]+"; "") | sub("\\?.*$"; "")
              | if startswith("/room/") then "/room/:x"
                elif startswith("/v1/saves/") then "/v1/saves/:x"
                elif startswith("/v1/realm/") then "/v1/realm/:x"
                else split("/") | map(if test("^[a-z][a-z0-9-]*$") or . == "" then . else ":x" end) | .[0:4] | join("/") end;
            def fold: split("\n")[0] | gsub("\"[^\"]*\""; "\"…\"") | gsub("/v1/[^ ]*"; "/v1/…") | gsub("[0-9a-f]{12,}"; "<id>") | .[0:180];
            "events: \(length)",
            "=== requests: n, status, outcome, route",
            ([ .[] | select(.event.request != null) | "\(.event.response.status // "-")\t\(.outcome)\t\(.event.request.url | norm)" ]
              | group_by(.) | map("\(length)\t\(.[0])") | sort_by(-(split("\t")[0] | tonumber)) | .[0:40][]),
            "=== non-request events: kind, outcome, n",
            ([ .[] | select(.event.request == null) | "\(.event.cron // (.event | keys | join(",")))\t\(.outcome)" ] | group_by(.) | map("\(length)\t\(.[0])") | .[]),
            "=== errors and warnings, first line, quoted words folded",
            ([ .[] | (.exceptions[]? | .message), (.logs[]? | select(.level == "error" or .level == "warn") | .message | map(tostring) | join(" ")) ]
              | map(fold) | group_by(.) | map("\(length)\t\(.[0])") | sort_by(-(split("\t")[0] | tonumber)) | .[0:25][])'
          echo "######## the account service"; jq -s -r "$agg" "$RUNNER_TEMP/acc.json" || echo "unreadable"
          echo "######## the relay"; jq -s -r "$agg" "$RUNNER_TEMP/relay.json" || echo "unreadable"
